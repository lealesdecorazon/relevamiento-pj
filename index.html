<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualizando Padrón | Unidad Básica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --celeste-dark: #0077b6;
      --celeste-light: #00b4d8;
      --bg-color: #f8f9fa;
      --text-color: #2b2d42;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Barlow', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }

    .maintenance-card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 119, 182, 0.15);
      max-width: 500px;
      width: 100%;
      border-top: 6px solid var(--celeste-dark);
    }

    .icon-container {
      font-size: 3.5rem;
      margin-bottom: 15px;
      animation: pulse 2s infinite;
    }

    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--celeste-dark);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #555;
      margin-bottom: 25px;
    }

    .badge {
      display: inline-block;
      background-color: rgba(0, 180, 216, 0.12);
      color: var(--celeste-dark);
      font-weight: 600;
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .btn-reload {
      background: var(--celeste-dark);
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-family: 'Barlow', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-reload:hover {
      background: #005f92;
    }

    .btn-reload:active {
      transform: scale(0.98);
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="maintenance-card">
    <div class="icon-container">🔄</div>
    <div class="badge">Relevamiento Territorial - PJ Comuna 5</div>
    <h1>Actualizando la Base de Datos</h1>
    <p>Estamos sincronizando los datos del padrón con las novedades. En unos minutos volverá a estar disponible.</p>
    
    <button class="btn-reload" onclick="location.reload()">
      Reintentar ingresar ↻
    </button>
  </div>

</body>
</html>
